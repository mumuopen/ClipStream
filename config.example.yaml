# ClipStream 配置示例（复制为 config.yaml 后按需修改）
# 注意：config.yaml 已加入 .gitignore，不会提交到 GitHub——请勿在本文件中填写真实密钥
# 引擎缺失不用手动找：clipstream engines 体检，clipstream engines install 自动下载（官方源，尊重 proxy）

data_dir: ./data
proxy: "http://127.0.0.1:7897"   # 仅海外源走代理；B站/虎牙等国内平台自动直连

engines:
  ytdlp: ""                     # 视频下载：留空走 PATH；都没有就 engines install 自动装
  ffmpeg: ""                    # 转码/切片/烧字幕（自动装）
  ffprobe: ""                   # 与 ffmpeg 同包自动落位
  biliup: ""                    # B站投稿引擎（自动装）
  asr:
    binary: ""                  # whisper.cpp 可执行文件 whisper-cli（自动装）
    model: ""                   # ggml 模型：自动装默认 small(~466MB)；install --model tiny|base|medium 换档

llm:
  base_url: "https://api.deepseek.com/v1"  # OpenAI 兼容端点
  api_key: ""                    # 你的 API Key（必填才启用 LLM 高光/解说/翻译）
  model: "deepseek-flash"        # DeepSeek 现行模型名（flash=V4.1-Flash 便宜快；pro 用 deepseek-v4-pro）
                                 # 注意：旧名 deepseek-chat/deepseek-reasoner 已于 2026-07-24 退役
  thinking: "disabled"           # V4 系默认开思考模式（effort=high）：批量打分用 disabled 更快更省；留空=不传参
  proxy: ""

web:
  listen: "127.0.0.1:8899"

publish:
  headless: false                # 抖音浏览器发布是否无头（当前平台规划中）
  screenshots: true
  platforms_dir: "configs/platforms"
  active_hours: "10:00-23:00"     # 发布窗口：窗口外不派发（夜里发没人看，且下播即批量入池立刻发是机器签名）；
                                 # 空=全天可发（不限时间）；支持跨夜如 "22:00-06:00"
  rate_limit:                    # 发布节流四闸（防风控：高频投稿限流/封号；手动+自动统一受限）——前两道 0=不限制
    min_interval_min: 10         # 同账号两次发布最小间隔分钟（0=不限）；叠加 ±5% 随机抖动去整点节拍特征
    daily_max: 9                 # 每账号每日最大发布数（0=不限）：9 条×10min ≈ 窗口开头 90 分钟发完当日配额
    max_inflight: 9              # 同账号同时在途（running）发布任务上限（0=不限）：上传慢于间隔时防多条并发的保险丝
    risk_cooldown_hours: 24      # 平台限流熔断（B站 137022"投稿过于频繁"）基础冷却时长（0=默认 24）；
                                 # 连续触发翻倍 24→48→96h 封顶 7 天；冷却到点自动恢复，发布中心可手动提前恢复

notify:
  pushme:
    enable: true                  # 总开关
    url: ""                       # 自建 pushme 服务地址，如 http://server:36591（留空=官方 PushMe 云）
    push_key: ""                  # 手机 PushMe App 的 push_key

chrome:
  path: ""                       # 本机 Chrome 可执行路径，留空则自动探测

live:
  check_interval: 60            # 开播检测轮询秒
  segment_time: 600             # 录制分段秒
  auto_clip: true               # 下播后自动送切片管线
  max_stale_sec: 300            # 素材停滞兜底：超过此时长无新分段即强制收工（0=关，不建议关——下播后 API 仍报在播时会挂死）
  preview_keywords: ["预告", "凌晨见"]  # 标题含任一关键词不视为真开播（赛事房轮播预告画面 API 也在播，只有标题能区分）
  pool_high: 20                 # 池背压：待发池 pending ≥ 此值暂停录制与送切（防"切片生成>发布"的慢性积压——
                                # 赛事切片隔周发=白发，且 pending 引用的成品目录清不掉；0=关闭）
  pool_low: 10                  # 解除水位：待发池降回此值以下恢复录制（滞回区间防临界抖动；须低于 pool_high）

retention:                       # 磁盘清理（挂机刚需，daemon 定时执行）
  enabled: true
  segments_days: 7               # 录制会话保留天数（超期整目录删）
  consumed_seg_days: 1           # 预留：已消费分段更激进清理
  min_free_percent: 10           # 磁盘剩余低于此百分比：预警+自动删最旧（守“盘快满”）
  max_usage_percent: 50          # 数据目录占用上限（整盘%，0=关）：超限从最旧会话删起（守“这块盘只肯给你一半”）；
                                 # 正在录制的会话目录绝不动
  published_keep_days: 3         # 已发布切片成品目录保留天数（data/jobs/，0=不清）：到期且池条目全部终态才删；
                                 # 任务行保留 DB 可查——成品与截图只进不出是磁盘长尾膨胀主因
  check_minutes: 60              # 清理检查间隔（分钟）

auto_review:                     # 自动审核（挂机无人值守）
  enabled: false                 # 开：切片完成自动过闸入池，不再等人工；关：全部进审核台（现状）
  min_score: 60                  # LLM 评分 ≥ 此值才自动入池（等分回退切片无评分，只会留人工）
  hard_min_dur_sec: 15           # 硬闸：短于此直接拒发
  hard_max_dur_sec: 120          # 硬闸：长于此直接拒发
  banned_words: []               # 质闸：标题含这些词不自动发（进人工审核台），如 ["违禁词A", "违禁词B"]