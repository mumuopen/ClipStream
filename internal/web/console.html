<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GuanClip 控制台</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3;
    --muted: #8b949e; --accent: #4f8cc9; --ok: #3fb950; --warn: #d29922; --err: #f85149;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; padding: 0 0 60px; }
  header { padding: 20px 24px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: baseline; gap: 12px; }
  header h1 { font-size: 20px; }
  header .sub { color: var(--muted); font-size: 12px; }
  main { max-width: 1080px; margin: 0 auto; padding: 20px 24px; }

  .newjob { display: flex; gap: 10px; margin-bottom: 24px; }
  .newjob input { flex: 1; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; color: var(--text); font-size: 14px; outline: none; }
  .newjob input:focus { border-color: var(--accent); }
  .newjob button { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 10px 22px; font-size: 14px; cursor: pointer; white-space: nowrap; }
  .newjob button:hover { filter: brightness(1.15); }
  .newjob button:disabled { opacity: .5; cursor: wait; }
  .hint { color: var(--muted); font-size: 12px; margin: -16px 0 20px; }

  .job { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 14px; overflow: hidden; }
  .job-row { display: flex; align-items: center; gap: 14px; padding: 14px 16px; cursor: pointer; }
  .job-row:hover { background: #1c2129; }
  .job-id { font-family: Consolas, monospace; color: var(--muted); font-size: 12px; min-width: 120px; }
  .badge { padding: 2px 10px; border-radius: 999px; font-size: 12px; white-space: nowrap; }
  .badge.queued  { background: #30363d; color: var(--muted); }
  .badge.running { background: #1f3a5f; color: #79c0ff; }
  .badge.review  { background: #3d2e00; color: var(--warn); }
  .badge.done    { background: #0f2e18; color: var(--ok); }
  .badge.failed  { background: #3d1418; color: var(--err); }
  .badge.canceled{ background: #30363d; color: var(--muted); }
  .stage { color: var(--muted); font-size: 12px; min-width: 90px; }
  .bar { flex: 1; height: 6px; background: #21262d; border-radius: 3px; overflow: hidden; min-width: 80px; }
  .bar > div { height: 100%; background: var(--accent); transition: width .4s; }
  .pct { font-size: 12px; color: var(--muted); width: 40px; text-align: right; }
  .job-input { flex: 2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); font-size: 13px; }
  .del { border: none; background: none; color: var(--muted); cursor: pointer; font-size: 15px; padding: 4px; }
  .del:hover { color: var(--err); }

  .detail { border-top: 1px solid var(--border); padding: 16px; background: #11151c; display: none; }
  .detail.open { display: block; }
  .detail h4 { font-size: 13px; color: var(--muted); margin: 12px 0 8px; }
  pre.log { background: #0a0e14; border: 1px solid var(--border); border-radius: 8px; padding: 12px; font: 12px/1.7 Consolas, monospace; max-height: 240px; overflow: auto; white-space: pre-wrap; }
  .err-line { color: var(--err); white-space: pre-wrap; margin: 10px 0; }

  .clips { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .clip { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .clip video { width: 100%; aspect-ratio: 16/9; background: #000; display: block; }
  .clip img.cover { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: #000; }
  .clip .meta { padding: 10px 12px; }
  .clip .title { font-size: 13px; margin-bottom: 4px; }
  .clip .info { color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
  .clip a { color: var(--accent); text-decoration: none; font-size: 12px; }
  .empty { text-align: center; color: var(--muted); padding: 40px; }

  .pub-btn { margin-top: 8px; width: 100%; background: #1f3a5f; color: #79c0ff; border: 1px solid #2c4a6e; border-radius: 6px; padding: 6px 0; cursor: pointer; font-size: 12px; }
  .pub-btn:hover { background: #24466e; }
  .pub-btn.sub-btn { background: #143242; color: #56d4dd; border-color: #1d4a56; }
  .pub-btn.sub-btn:hover { background: #1a4256; }
  .pub-btn.dub-btn { background: #2a2340; color: #b3a1e8; border-color: #3d3460; }
  .pub-btn.dub-btn:hover { background: #352c52; }

  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: none; align-items: center; justify-content: center; z-index: 100; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; width: min(500px, 92vw); display: flex; flex-direction: column; gap: 10px; }
  .modal h3 { font-size: 16px; margin-bottom: 4px; }
  .modal .pub-meta { color: var(--muted); font-size: 12px; font-family: Consolas, monospace; background: #0a0e14; border-radius: 6px; padding: 6px 10px; }
  .modal label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  .modal input[type=text], .modal input:not([type=checkbox]):not([type=radio]), .modal textarea { background: #0a0e14; border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; color: var(--text); font-size: 13px; outline: none; resize: vertical; }
  .modal input:focus, .modal textarea:focus { border-color: var(--accent); }
  .modal-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .modal-row label { flex-direction: row; align-items: center; gap: 6px; color: var(--text); font-size: 13px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-actions button { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 9px 20px; font-size: 13px; cursor: pointer; }
  .modal-actions button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }

  .pub-result { padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; font-size: 13px; white-space: pre-wrap; }
  .pub-result.ok { border-color: #1f4d2a; }
  .pub-result.fail { border-color: #5a2226; }
  .pub-result img { margin-top: 8px; border-radius: 6px; max-width: 100%; }
</style>
</head>
<body>
<header>
  <h1>GuanClip</h1>
  <span class="sub">ChopperBot 融合平台 · M1 搬运+智能切片 · 直播/翻译/发布后续里程碑</span>
</header>
<main>
  <div class="newjob">
    <input id="input" placeholder="粘贴视频 URL（YouTube/B站…）或本地文件路径，回车提交">
    <button id="submit" onclick="submitJob()">创建任务</button>
  </div>
  <div class="hint">管线：下载 → 转写 → 高光 → 切片 → 审核。ASR/LLM 未配置时自动降级（等分切片），任务产物在本机 data/jobs/ 目录。</div>

  <div id="list"></div>
</main>

<div id="pub-bg" class="modal-bg" onclick="if(event.target===this)closePubModal()">
  <div class="modal">
    <h3>发布切片</h3>
    <div id="pub-meta" class="pub-meta"></div>
    <div class="modal-row">
      <label><input type="checkbox" id="pub-bilibili" checked> B站</label>
      <label><input type="checkbox" id="pub-douyin"> 抖音</label>
      <label><input type="checkbox" id="pub-dryrun"> 演练模式（不真发）</label>
    </div>
    <label>标题
      <input type="text" id="pub-title" maxlength="80">
    </label>
    <label>描述
      <textarea id="pub-desc" rows="2"></textarea>
    </label>
    <label>话题（逗号分隔，B站作 tag、抖音作 #话题）
      <input type="text" id="pub-tags" placeholder="如：AI, 科技, 教程">
    </label>
    <div class="modal-actions">
      <button class="ghost" onclick="closePubModal()">取消</button>
      <button onclick="submitPublish()">提交发布</button>
    </div>
  </div>
</div>

<div id="sub-bg" class="modal-bg" onclick="if(event.target===this)closeSubModal()">
  <div class="modal">
    <h3>给切片加字幕</h3>
    <div id="sub-meta" class="pub-meta"></div>
    <div class="modal-row">
      <label><input type="radio" id="sub-style-bi" name="substyle" checked> 双语（原文+中文）</label>
      <label><input type="radio" id="sub-style-zh" name="substyle"> 仅中文</label>
    </div>
    <div class="hint" style="margin:0">流程：DeepSeek 翻译该片段转写 → SRT 烧录进画面 → 生成 *_sub.mp4 回审核台</div>
    <div class="modal-actions">
      <button class="ghost" onclick="closeSubModal()">取消</button>
      <button onclick="submitSubtitle()">开始加字幕</button>
    </div>
  </div>
</div>

<div id="dub-bg" class="modal-bg" onclick="if(event.target===this)closeDubModal()">
  <div class="modal">
    <h3>配音解说</h3>
    <div id="dub-meta" class="pub-meta"></div>
    <label>音色
      <select id="dub-voice">
        <option value="云健(男·播音)">云健（男·播音腔，默认）</option>
        <option value="云希(男·沉稳)">云希（男·沉稳）</option>
        <option value="晓晓(女·亲和)">晓晓（女·亲和）</option>
        <option value="晓伊(女·温柔)">晓伊（女·温柔）</option>
      </select>
    </label>
    <div class="modal-row">
      <label><input type="checkbox" id="dub-keep"> 保留原声做背景（默认纯解说）</label>
    </div>
    <div class="hint" style="margin:0">流程：DeepSeek 按转写写解说稿 → edge-tts 合成 → 变速对齐 → 替换音轨 → 生成 *_dub.mp4 回审核台</div>
    <div class="modal-actions">
      <button class="ghost" onclick="closeDubModal()">取消</button>
      <button onclick="submitDub()">开始配音</button>
    </div>
  </div>
</div>

<script>
'use strict';
const STATUS_CN = { queued: '排队', running: '执行中', review: '待审核', done: '完成', failed: '失败', canceled: '已取消' };
const $ = s => document.querySelector(s);
let jobs = [];          // 列表快照
let openId = null;      // 当前展开的 job
let es = null;          // EventSource
let detailClips = [];   // 当前展开任务详情里的切片列表（供发布/字幕弹窗用）
let pubCtx = null;      // 发布弹窗上下文 {jobId, clip}
let subCtx = null;      // 字幕弹窗上下文 {jobId, clip}
let dubCtx = null;      // 配音弹窗上下文 {jobId, clip}

function fmtTime(ts) {
  const d = new Date(ts * 1000);
  return d.toLocaleTimeString('zh-CN', { hour12: false });
}

async function fetchJSON(url, opt) {
  const r = await fetch(url, opt);
  if (!r.ok) throw new Error(r.status + ' ' + await r.text());
  return r.json();
}

async function submitJob() {
  const input = $('#input').value.trim();
  if (!input) return;
  $('#submit').disabled = true;
  try {
    await fetchJSON('/api/jobs', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ input: input, kind: 'clips' }) });
    $('#input').value = '';
    refreshList();
  } catch (e) { alert('创建失败：' + e.message); }
  $('#submit').disabled = false;
}
$('#input').addEventListener('keydown', e => { if (e.key === 'Enter') submitJob(); });

async function refreshList() {
  try {
    jobs = await fetchJSON('/api/jobs');
    render();
  } catch (e) { /* 服务重启中 */ }
}

function clipHTML(job, c, idx) {
  const file = '/api/files/' + job.id + '/' + c.file;
  const cover = c.cover ? '/api/files/' + job.id + '/' + c.cover : null;
  const dur = Math.round(c.end - c.start);
  return `<div class="clip">
    <video controls preload="metadata" src="${file}" ${cover ? `poster="${cover}"` : ''}></video>
    <div class="meta">
      <div class="title">${esc(c.title || '未命名')}</div>
      <div class="info"><span>${fmtRange(c.start, c.end)} · ${dur}s${c.score ? ' · 评分 ' + Math.round(c.score) : ''}</span>
      <a href="${file}" download>下载</a></div>
      ${job.status === 'review' ? `<button class="pub-btn" onclick="openPubModal('${job.id}', ${idx})">发布此切片</button>
      <button class="pub-btn sub-btn" onclick="openSubModal('${job.id}', ${idx})">加字幕</button>
      <button class="pub-btn dub-btn" onclick="openDubModal(${JSON.stringify({ jobId: job.id, clip: { file: c.file, cover: c.cover || '', title: c.title } })})">配音解说</button>` : ''}
    </div>
  </div>`;
}

function fmtRange(s, e) {
  const f = t => Math.floor(t / 60) + ':' + String(Math.round(t % 60)).padStart(2, '0');
  return f(s) + ' - ' + f(e);
}

function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

function render() {
  const list = $('#list');
  if (!jobs || !jobs.length) { list.innerHTML = '<div class="empty">暂无任务，粘贴一个视频地址开始</div>'; return; }
  list.innerHTML = jobs.map(j => `
    <div class="job" id="job-${j.id}">
      <div class="job-row" onclick="toggle('${j.id}')">
        <span class="job-id">${j.id}</span>
        <span class="badge ${j.status}">${STATUS_CN[j.status] || j.status}</span>
        <span class="stage">${j.stage ? j.stage : ''}</span>
        <div class="bar"><div style="width:${j.progress}%"></div></div>
        <span class="pct">${j.progress}%</span>
        <span class="job-input" title="${esc(j.input)}">${esc(j.input)}</span>
        <button class="del" title="删除" onclick="event.stopPropagation();delJob('${j.id}')">✕</button>
      </div>
      <div class="detail" id="detail-${j.id}"></div>
    </div>`).join('');
  // 轮询重建 DOM 后，恢复展开状态并刷新详情（SSE 断流时的兑底）
  if (openId) {
    const el = document.getElementById('detail-' + openId);
    const job = jobs.find(j => j.id === openId);
    if (el && job) { el.classList.add('open'); renderDetailBody(el, job); }
    else closeDetail(); // 任务被删除
  }
}

async function toggle(id) {
  if (openId === id) { closeDetail(); return; }
  closeDetail();
  openId = id;
  $('#detail-' + id).classList.add('open');
  const job = jobs.find(j => j.id === id);
  if (job) renderDetailBody($('#detail-' + id), job);
  connectSSE(id);
  try { const fresh = await fetchJSON('/api/jobs/' + id); renderDetailBody($('#detail-' + id), fresh); } catch (e) {}
}

function closeDetail() {
  if (es) { es.close(); es = null; }
  if (openId && $('#detail-' + openId)) $('#detail-' + openId).classList.remove('open');
  openId = null;
}

function connectSSE(id) {
  if (es) es.close();
  es = new EventSource('/api/jobs/' + id + '/events');
  es.onmessage = ev => {
    try {
      const msg = JSON.parse(ev.data);
      if (msg.type === 'log' && msg.msg) {
        appendLog(id, msg.msg);
      } else if (msg.type === 'job' && msg.job) {
        renderDetailBody($('#detail-' + id), msg.job);
      }
    } catch (e) {}
  };
  es.onerror = () => { /* 断流时由轮询兑底，EventSource 自动重连 */ };
}

function appendLog(id, line) {
  const pre = document.querySelector('#detail-' + id + ' pre.log');
  if (pre) { pre.textContent += fmtTime(Date.now() / 1000) + ' ' + line + '\n'; pre.scrollTop = pre.scrollHeight; }
}

function renderDetailBody(el, job) {
  if (!el || !job) return;
  let extraHTML = '';
  try {
    const r = JSON.parse(job.result || '{}');
    if (job.kind === 'publish' && r.results) {
      // 发布任务结果：平台成败 + 截图
      extraHTML = '<h4>发布结果' + (r.dry_run ? '（演练）' : '') + '</h4>' + r.results.map(pr => `
        <div class="pub-result ${pr.ok ? 'ok' : 'fail'}">${pr.ok ? '✔' : '✗'} <b>${esc(pr.platform)}</b>：${esc(pr.detail || '')}
        ${pr.screenshot ? `<img src="/api/files/${job.id}/${pr.screenshot}">` : ''}</div>`).join('');
    } else if (job.kind === 'subtitle' && r.subtitled) {
      // 字幕任务结果：烧字幕切片预览 + 直接发布入口
      const src = r.source_job, f = '/api/files/' + src + '/' + r.subtitled;
      const cover = r.cover ? '/api/files/' + src + '/' + r.cover : null;
      extraHTML = `<h4>字幕成品（${r.segments} 条 · ${r.style === 'bilingual' ? '双语' : '纯中文'}）</h4>
        <div class="clip" style="max-width:480px">
          <video controls preload="metadata" src="${f}" ${cover ? `poster="${cover}"` : ''}></video>
          <div class="meta">
            <div class="title">${esc(r.title || '')}</div>
            <div class="info"><span>原片：${esc(r.original)}</span><a href="${f}" download>下载</a></div>
            ${job.status === 'review' ? `<button class="pub-btn" onclick='openPubModalFor(${JSON.stringify({ jobId: src, clip: { file: r.subtitled, cover: r.cover || '', title: r.title } })})'>发布此切片</button>
            <button class="pub-btn dub-btn" onclick='openDubModal(${JSON.stringify({ jobId: src, clip: { file: r.subtitled, cover: r.cover || '', title: r.title } })})'>配音解说</button>` : ''}
          </div>
        </div>`;
    } else if (r.clips && r.clips.length) {
      detailClips = r.clips;
      extraHTML = '<h4>切片成品（' + r.clips.length + '）</h4><div class="clips">' + r.clips.map((c, i) => clipHTML(job, c, i)).join('') + '</div>';
    }
  } catch (e) {}
  el.innerHTML = `
    ${job.error ? '<div class="err-line">✗ ' + esc(job.error) + '</div>' : ''}
    <h4>运行日志</h4>
    <pre class="log">${esc(job.log || '（等待输出…）')}</pre>
    ${extraHTML}`;
  const pre = el.querySelector('pre.log');
  if (pre) pre.scrollTop = pre.scrollHeight;
}

async function delJob(id) {
  if (!confirm('删除任务 ' + id + '？（文件保留在 data/jobs/）')) return;
  try { await fetchJSON('/api/jobs/' + id, { method: 'DELETE' }); if (openId === id) closeDetail(); refreshList(); } catch (e) { alert(e.message); }
}

// ---- 发布/字幕弹窗 ----

function openPubModal(jobId, idx) {
  const c = detailClips[idx];
  if (!c) return;
  openPubModalFor({ jobId, clip: c });
}

// 通用发布弹窗：clip = {file, cover, title}
function openPubModalFor(ctx) {
  pubCtx = ctx;
  const c = ctx.clip;
  $('#pub-meta').textContent = c.file + (c.cover ? ' ｜ 封面: ' + c.cover : ' ｜ 无封面');
  $('#pub-title').value = c.title || '';
  $('#pub-desc').value = '';
  $('#pub-tags').value = '';
  $('#pub-dryrun').checked = false;
  $('#pub-bg').style.display = 'flex';
}

function closePubModal() {
  $('#pub-bg').style.display = 'none';
  pubCtx = null;
}

async function submitPublish() {
  if (!pubCtx) return;
  const platforms = [];
  if ($('#pub-bilibili').checked) platforms.push('bilibili');
  if ($('#pub-douyin').checked) platforms.push('douyin');
  if (!platforms.length) { alert('至少选择一个发布平台'); return; }
  const req = {
    source_job: pubCtx.jobId,
    clip: pubCtx.clip.file,
    cover: pubCtx.clip.cover || '',
    title: $('#pub-title').value.trim() || (pubCtx.clip.title || ''),
    desc: $('#pub-desc').value.trim(),
    tags: $('#pub-tags').value.split(/[,，、\s]+/).filter(Boolean),
    platforms: platforms,
    dry_run: $('#pub-dryrun').checked
  };
  try {
    await fetchJSON('/api/jobs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ kind: 'publish', input: JSON.stringify(req) })
    });
    closePubModal();
    refreshList();
  } catch (e) { alert('创建发布任务失败：' + e.message); }
}

// ---- 字幕弹窗 ----

function openSubModal(jobId, idx) {
  const c = detailClips[idx];
  if (!c) return;
  subCtx = { jobId, clip: c };
  $('#sub-meta').textContent = c.file + ' ｜ ' + (c.title || '');
  $('#sub-style-bi').checked = true;
  $('#sub-style-zh').checked = false;
  $('#sub-bg').style.display = 'flex';
}

function closeSubModal() {
  $('#sub-bg').style.display = 'none';
  subCtx = null;
}

async function submitSubtitle() {
  if (!subCtx) return;
  const style = $('#sub-style-bi').checked ? 'bilingual' : 'zh';
  const req = {
    source_job: subCtx.jobId,
    clip: subCtx.clip.file,
    style: style
  };
  try {
    await fetchJSON('/api/jobs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ kind: 'subtitle', input: JSON.stringify(req) })
    });
    closeSubModal();
    refreshList();
  } catch (e) { alert('创建字幕任务失败：' + e.message); }
}

// ---- 配音弹窗 ----

function openDubModal(ctx) {
  dubCtx = ctx;
  $('#dub-meta').textContent = ctx.clip.file + ' ｜ ' + (ctx.clip.title || '');
  $('#dub-bg').style.display = 'flex';
}

function closeDubModal() {
  $('#dub-bg').style.display = 'none';
  dubCtx = null;
}

async function submitDub() {
  if (!dubCtx) return;
  const req = {
    source_job: dubCtx.jobId,
    clip: dubCtx.clip.file,
    voice: $('#dub-voice').value,
    keep_audio: $('#dub-keep').checked
  };
  try {
    await fetchJSON('/api/jobs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ kind: 'dub', input: JSON.stringify(req) })
    });
    closeDubModal();
    refreshList();
  } catch (e) { alert('创建配音任务失败：' + e.message); }
}

refreshList();
setInterval(() => { if (!document.hidden) refreshList(); }, 2500);
</script>
</body>
</html>
