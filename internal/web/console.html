<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GuanClip 控制台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230B0E14'/%3E%3Ccircle cx='8' cy='8' r='4' fill='%23F5A524'/%3E%3C/svg%3E">
<style>
  /* ── 设计令牌：视频工厂控制室（模块地图对齐原版 ChopperBot）── */
  :root {
    --bg: #0B0E14; --panel: #12161F; --panel-2: #161B26; --line: #1F2430;
    --text: #C9D1DB; --muted: #6E7A8C; --faint: #59667B;
    --amber: #F5A524; --amber-dim: #8f6217;
    --ok: #3FB950; --err: #F85149; --run: #4F8CC9;
    --c-clips: #4F8CC9; --c-publish: #E8894C; --c-subtitle: #56D4DD; --c-dub: #B3A1E8;
    --mono: Consolas, "Cascadia Mono", "JetBrains Mono", monospace;
    --sidebar-w: 208px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { color-scheme: dark; }
  body {
    background: radial-gradient(1200px 500px at 70% -10%, rgba(245,165,36,.05), transparent 60%), var(--bg);
    color: var(--text); font: 14px/1.65 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    min-height: 100vh; -webkit-font-smoothing: antialiased;
  }
  ::selection { background: rgba(245,165,36,.35); }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  /* ── 布局骨架：侧栏 + 内容区 ── */
  .shell { display: flex; min-height: 100vh; }
  aside.side {
    width: var(--sidebar-w); flex-shrink: 0; position: sticky; top: 0; height: 100vh; overflow-y: auto;
    background: #0E1118; border-right: 1px solid var(--line); padding: 20px 0 24px;
  }
  main.main { flex: 1; min-width: 0; padding: 28px 28px 80px; max-width: 1080px; margin: 0 auto; }

  /* 侧栏 */
  .side .brand { padding: 0 18px 18px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .side .logo { font: 800 19px/1 var(--mono); letter-spacing: .18em; color: #E8EDF4; }
  .side .logo::first-letter { color: var(--amber); }
  .side .tag { font-size: 10px; color: var(--muted); letter-spacing: .12em; margin-top: 5px; }
  .nav-group { font: 600 10px var(--mono); color: #4A5568; letter-spacing: .2em; padding: 14px 18px 6px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 9px 18px; color: var(--muted);
    text-decoration: none; font-size: 13px; cursor: pointer; border-left: 2px solid transparent; transition: color .15s, background .15s;
  }
  .nav-item:hover { color: var(--text); background: rgba(255,255,255,.025); }
  .nav-item.active { color: var(--amber); border-left-color: var(--amber); background: rgba(245,165,36,.06); font-weight: 600; }
  .nav-item .badge-mini { font: 10px var(--mono); margin-left: auto; background: var(--amber); color: #17110A; border-radius: 8px; padding: 0 6px; }
  .nav-item .soon { font: 9px var(--mono); margin-left: auto; color: #4A5568; letter-spacing: .1em; }
  .side .status { margin-top: 18px; padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 10px; flex-wrap: wrap; }
  .side .status .e { display: inline-flex; align-items: center; gap: 5px; font: 11px var(--mono); color: var(--muted); }
  .side .dot { width: 6px; height: 6px; border-radius: 50%; background: #2A3040; }
  .side .e.on .dot { background: var(--ok); box-shadow: 0 0 5px rgba(63,185,80,.5); }

  /* 页头 */
  .page-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px; }
  .page-head h2 { font-size: 17px; font-weight: 700; color: #E8EDF4; letter-spacing: .02em; }
  .page-head .ph-sub { font-size: 12px; color: var(--muted); }
  .page-head .ph-note { font: 11px var(--mono); color: var(--amber-dim); margin-left: auto; letter-spacing: .15em; }

  /* 投料区 */
  .feed { display: flex; gap: 10px; margin-bottom: 16px; }
  .feed input {
    flex: 1; height: 46px; background: var(--panel); border: 1px solid #2A3242; border-radius: 9px;
    padding: 0 16px; color: var(--text); font-size: 14px; outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .feed input::placeholder { color: var(--faint); }
  .feed input:focus { border-color: var(--amber-dim); box-shadow: 0 0 0 3px rgba(245,165,36,.08); }
  .feed button {
    height: 46px; background: linear-gradient(180deg, #F7B23E, #EFA21C); color: #17110A; border: none; border-radius: 9px;
    padding: 0 28px; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap;
    box-shadow: 0 2px 12px rgba(245,165,36,.18); transition: filter .15s, box-shadow .15s;
  }
  .feed button:hover { filter: brightness(1.08); box-shadow: 0 4px 16px rgba(245,165,36,.26); }
  .feed button:disabled { opacity: .5; cursor: wait; }

  /* 数字带 */
  .strip {
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 12px;
    margin-bottom: 24px; padding: 14px 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  }
  .strip .s { display: flex; flex-direction: column; gap: 3px; }
  .strip .n { font: 700 24px/1.1 var(--mono); color: #E8EDF4; font-variant-numeric: tabular-nums; }
  .strip .l { font-size: 10px; color: var(--muted); letter-spacing: .18em; }
  .strip .s.ok .n { color: var(--ok); }
  .strip .s.warn .n { color: var(--amber); }
  .strip .s.warn.pulse .n { animation: breathe 2s ease-in-out infinite; }
  .strip .s.err .n { color: var(--err); }
  @keyframes breathe { 50% { opacity: .55; } }

  /* 任务卡 */
  .job { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; overflow: hidden; transition: border-color .15s; }
  .job:hover { border-color: #2B3344; }
  .job-row { display: flex; align-items: center; gap: 14px; padding: 14px 18px; cursor: pointer; }
  .kind { font: 11px var(--mono); padding: 3px 0; min-width: 62px; text-align: center; border-radius: 5px; letter-spacing: .06em; flex-shrink: 0; }
  .kind.clips    { color: var(--c-clips); background: rgba(79,140,201,.12); }
  .kind.publish  { color: var(--c-publish); background: rgba(232,137,76,.12); }
  .kind.subtitle { color: var(--c-subtitle); background: rgba(86,212,221,.12); }
  .kind.dub      { color: var(--c-dub); background: rgba(179,161,232,.12); }
  .jid { font: 11px var(--mono); color: var(--muted); flex-shrink: 0; }

  /* 流水线轨道（signature） */
  .track { display: flex; align-items: center; flex: 1; min-width: 150px; gap: 0; }
  .track .node { width: 11px; height: 11px; border-radius: 50%; background: transparent; border: 2px solid #414C60; flex-shrink: 0; }
  .track .seg { height: 2px; flex: 1; background: #333D4F; min-width: 10px; }
  .track .node.done { background: #4A5568; border-color: #4A5568; }
  .track .seg.done { background: #4A5568; }
  .track .node.active { background: var(--amber); border-color: var(--amber); box-shadow: 0 0 0 0 rgba(245,165,36,.5); animation: signal 1.6s ease-out infinite; }
  .track .seg.active { background: linear-gradient(90deg, #4A5568, #B87F2F); }
  .track .node.fail { background: var(--err); border-color: var(--err); }
  @keyframes signal { 70% { box-shadow: 0 0 0 7px rgba(245,165,36,0); } 100% { box-shadow: 0 0 0 0 rgba(245,165,36,0); } }

  .badge { font-size: 11px; padding: 2px 9px; border-radius: 999px; white-space: nowrap; flex-shrink: 0; }
  .badge.queued  { color: var(--muted); background: #1B212C; }
  .badge.running { color: var(--run); background: rgba(79,140,201,.12); }
  .badge.review  { color: var(--amber); background: rgba(245,165,36,.12); }
  .badge.done    { color: var(--ok); background: rgba(63,185,80,.1); }
  .badge.failed  { color: var(--err); background: rgba(248,81,73,.1); }
  .badge.canceled{ color: var(--muted); background: #1B212C; }
  .jtime { font: 10px var(--mono); color: #4A5568; flex-shrink: 0; }
  .jinput { flex: 2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: #8B95A5; min-width: 60px; }
  .del { border: none; background: none; color: #4A5568; cursor: pointer; font-size: 14px; padding: 4px 6px; border-radius: 4px; flex-shrink: 0; transition: color .15s; }
  .del:hover { color: var(--err); }

  /* 详情 */
  .detail { border-top: 1px solid var(--line); padding: 16px; background: #0E1219; display: none; }
  .detail.open { display: block; }
  .detail h4 { font-size: 11px; color: var(--muted); letter-spacing: .16em; font-weight: 600; margin: 14px 0 8px; }
  .detail h4:first-child { margin-top: 0; }
  pre.log { background: #0A0D13; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; font: 12px/1.75 var(--mono); max-height: 260px; overflow: auto; white-space: pre-wrap; color: #9AA6B8; }
  .err-line { color: var(--err); font-size: 13px; white-space: pre-wrap; margin: 10px 0; background: rgba(248,81,73,.07); border: 1px solid rgba(248,81,73,.25); border-radius: 8px; padding: 10px 12px; }

  /* 切片网格 */
  .clips { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .clip { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; transition: border-color .15s; }
  .clip:hover { border-color: #2E3849; }
  .clip video { width: 100%; aspect-ratio: 16/9; background: #000; display: block; }
  .clip .meta { padding: 10px 12px 12px; }
  .clip .title { font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #DEE5EE; }
  .clip .info { color: var(--muted); font: 11px var(--mono); display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .clip a { color: var(--run); text-decoration: none; font-size: 11px; }
  .clip a:hover { text-decoration: underline; }
  .acts { display: flex; gap: 6px; margin-top: 8px; }
  .acts button { flex: 1; border-radius: 6px; padding: 6px 0; cursor: pointer; font-size: 12px; border: 1px solid; background: transparent; transition: background .15s; }
  .b-pub { color: var(--c-publish); border-color: #4d3521 !important; background: rgba(232,137,76,.08) !important; }
  .b-pub:hover { background: rgba(232,137,76,.18) !important; }
  .b-sub { color: var(--c-subtitle); border-color: #1d4045 !important; background: rgba(86,212,221,.08) !important; }
  .b-sub:hover { background: rgba(86,212,221,.18) !important; }
  .b-dub { color: var(--c-dub); border-color: #352d52 !important; background: rgba(179,161,232,.08) !important; }
  .b-dub:hover { background: rgba(179,161,232,.18) !important; }

  /* 结果卡 */
  .pub-result { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; font-size: 13px; white-space: pre-wrap; background: var(--panel-2); }
  .pub-result.ok { border-color: rgba(63,185,80,.35); }
  .pub-result.fail { border-color: rgba(248,81,73,.4); }
  .pub-result img { margin-top: 8px; border-radius: 6px; max-width: 100%; }
  .oneclip { max-width: 460px; }

  /* 筛选 chips */
  .chips { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .chip { font: 12px var(--mono); padding: 5px 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; transition: all .15s; }
  .chip:hover { color: var(--text); border-color: #2E3849; }
  .chip.on { color: var(--amber); border-color: var(--amber-dim); background: rgba(245,165,36,.08); }
  .chip .n { color: var(--faint); margin-left: 5px; }

  /* 占位页（M4/M5 建设中） */
  .ph-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 22px 24px; max-width: 720px; }
  .ph-card .ph-name { font-size: 16px; font-weight: 700; color: #E8EDF4; display: flex; align-items: center; gap: 10px; }
  .ph-card .ph-tag { font: 10px var(--mono); color: var(--amber); border: 1px solid var(--amber-dim); border-radius: 4px; padding: 2px 8px; letter-spacing: .12em; }
  .ph-card .ph-origin { font: 11px var(--mono); color: var(--faint); margin: 10px 0 12px; }
  .ph-card .ph-desc { font-size: 13px; color: var(--muted); line-height: 1.75; }
  .ph-card ul { margin: 14px 0 0 2px; list-style: none; }
  .ph-card li { font-size: 12.5px; color: var(--muted); padding: 4px 0; display: flex; gap: 8px; }
  .ph-card li::before { content: "·"; color: var(--amber-dim); }
  .coming { margin-top: 22px; padding-top: 16px; border-top: 1px dashed var(--line); }
  .coming .c1 { font: 12px var(--mono); color: var(--amber-dim); letter-spacing: .25em; }
  .coming .c2 { font-size: 11px; color: var(--faint); margin-top: 5px; }

  /* 设置页 */
  .set-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .set-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
  .set-card h4 { font-size: 11px; letter-spacing: .16em; color: var(--muted); margin-bottom: 12px; font-weight: 600; }
  .kv { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 13px; border-bottom: 1px solid #161B26; }
  .kv:last-child { border-bottom: none; }
  .kv .k { color: var(--muted); width: 72px; flex-shrink: 0; }
  .kv .v { color: var(--text); flex: 1; font-size: 12.5px; }
  .kv .st { font: 11px var(--mono); flex-shrink: 0; white-space: nowrap; }
  .st.on { color: var(--ok); } .st.off { color: var(--faint); } .st.warn { color: var(--amber); }
  .cmd { font: 12px var(--mono); background: #0A0D13; border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; color: #9AA6B8; margin: 6px 0; overflow-x: auto; white-space: nowrap; }
  .cmd b { color: var(--amber); font-weight: 400; }

  /* 弹窗 */
  .modal-bg { position: fixed; inset: 0; background: rgba(5,7,11,.72); backdrop-filter: blur(3px); display: none; align-items: center; justify-content: center; z-index: 100; }
  .modal { background: var(--panel); border: 1px solid #2A3242; border-radius: 12px; padding: 22px; width: min(500px, 92vw); display: flex; flex-direction: column; gap: 12px; box-shadow: 0 16px 48px rgba(0,0,0,.5); }
  .modal h3 { font-size: 15px; font-weight: 600; margin-bottom: 2px; letter-spacing: .04em; }
  .modal .mmeta { color: var(--muted); font: 11px var(--mono); background: #0A0D13; border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; word-break: break-all; }
  .modal label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--muted); }
  .modal input[type=text], .modal textarea, .modal select { background: #0A0D13; border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; color: var(--text); font-size: 13px; outline: none; resize: vertical; }
  .modal input:focus, .modal textarea:focus, .modal select:focus { border-color: var(--amber-dim); }
  .modal-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .modal-row label { flex-direction: row; align-items: center; gap: 7px; color: var(--text); font-size: 13px; }
  .modal .hint { color: var(--muted); font-size: 11px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }
  .modal-actions button { border-radius: 7px; padding: 9px 20px; font-size: 13px; cursor: pointer; border: none; }
  .modal-actions .go { background: var(--amber); color: #14100A; font-weight: 600; }
  .modal-actions .go:hover { filter: brightness(1.1); }
  .modal-actions .ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }

  .empty { text-align: center; color: var(--muted); padding: 64px 20px; border: 1.5px dashed #232B39; border-radius: 12px; }
  .empty .big { font-size: 15px; color: #8B95A5; margin-bottom: 6px; }
  .empty .small { font-size: 12px; }
  .empty .arrow { font: 18px var(--mono); color: var(--amber-dim); margin-bottom: 10px; display: block; }

  /* 响应式：窄屏侧栏收成顶部横滚条 */
  @media (max-width: 860px) {
    .shell { flex-direction: column; }
    aside.side { width: 100%; height: auto; position: static; border-right: none; border-bottom: 1px solid var(--line); padding: 10px 0; }
    .side .brand { padding: 8px 16px 6px; margin: 0; border: none; display: flex; align-items: baseline; gap: 10px; }
    .side .tag { display: none; }
    .side nav { display: flex; overflow-x: auto; gap: 2px; padding: 0 12px; }
    .nav-group { display: none; }
    .nav-item { padding: 7px 12px; white-space: nowrap; border-left: none; border-bottom: 2px solid transparent; }
    .nav-item.active { border-left: none; border-bottom-color: var(--amber); }
    .side .status { display: none; }
    main.main { padding: 20px 16px 60px; }
    .set-grid { grid-template-columns: 1fr; }
    .jinput, .jtime { display: none; }
    .strip { grid-auto-flow: row; grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>
<div class="shell">

  <aside class="side">
    <div class="brand">
      <div class="logo">GUANCLIP</div>
      <div class="tag">视频内容流水线 · ChopperBot 血统</div>
    </div>
    <nav id="nav"></nav>
    <div class="status" id="side-engines"></div>
  </aside>

  <main class="main">
    <div class="page-head">
      <h2 id="ph-title"></h2>
      <span class="ph-sub" id="ph-sub"></span>
      <span class="ph-note" id="ph-note"></span>
    </div>
    <div id="page"></div>
  </main>
</div>

<!-- 发布弹窗 -->
<div id="pub-bg" class="modal-bg" onclick="if(event.target===this)closePubModal()">
  <div class="modal">
    <h3>发布切片</h3>
    <div id="pub-meta" class="mmeta"></div>
    <div class="modal-row">
      <label><input type="checkbox" id="pub-bilibili" checked> B站</label>
      <label><input type="checkbox" id="pub-douyin"> 抖音</label>
      <label><input type="checkbox" id="pub-dryrun"> 演练模式（不真发）</label>
    </div>
    <label>标题<input type="text" id="pub-title" maxlength="80"></label>
    <label>描述<textarea id="pub-desc" rows="2"></textarea></label>
    <label>话题（逗号分隔，B站作 tag、抖音作 #话题）<input type="text" id="pub-tags" placeholder="如：NASA, 航天, 科普"></label>
    <div class="hint">真发前建议先演练：走到发布按钮前停下并存截图。</div>
    <div class="modal-actions">
      <button class="ghost" onclick="closePubModal()">取消</button>
      <button class="go" onclick="submitPublish()">提交发布</button>
    </div>
  </div>
</div>

<!-- 字幕弹窗 -->
<div id="sub-bg" class="modal-bg" onclick="if(event.target===this)closeSubModal()">
  <div class="modal">
    <h3>给切片加字幕</h3>
    <div id="sub-meta" class="mmeta"></div>
    <div class="modal-row">
      <label><input type="radio" id="sub-style-bi" name="substyle" checked> 双语（原文+中文）</label>
      <label><input type="radio" id="sub-style-zh" name="substyle"> 仅中文</label>
    </div>
    <div class="hint">DeepSeek 翻译该片段转写 → SRT 烧录进画面 → 生成 *_sub.mp4 回审核台</div>
    <div class="modal-actions">
      <button class="ghost" onclick="closeSubModal()">取消</button>
      <button class="go" onclick="submitSubtitle()">开始加字幕</button>
    </div>
  </div>
</div>

<!-- 配音弹窗 -->
<div id="dub-bg" class="modal-bg" onclick="if(event.target===this)closeDubModal()">
  <div class="modal">
    <h3>配音解说</h3>
    <div id="dub-meta" class="mmeta"></div>
    <label>音色
      <select id="dub-voice">
        <option value="云健(男·播音)">云健 · 男 · 播音腔（默认）</option>
        <option value="云希(男·沉稳)">云希 · 男 · 沉稳</option>
        <option value="晓晓(女·亲和)">晓晓 · 女 · 亲和</option>
        <option value="晓伊(女·温柔)">晓伊 · 女 · 温柔</option>
      </select>
    </label>
    <div class="modal-row">
      <label><input type="checkbox" id="dub-keep"> 保留原声做背景（默认纯解说）</label>
    </div>
    <div class="hint">DeepSeek 写解说稿 → edge-tts 合成 → 变速对齐 → 替换音轨 → 生成 *_dub.mp4</div>
    <div class="modal-actions">
      <button class="ghost" onclick="closeDubModal()">取消</button>
      <button class="go" onclick="submitDub()">开始配音</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* ═══════════ 基础 ═══════════ */
const STATUS_CN = { queued: '排队', running: '执行中', review: '待审核', done: '完成', failed: '失败', canceled: '已取消' };
const KIND_STAGES = {

const esc = s => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; };
const fmtRange = (s, e) => { const f = t => Math.floor(t / 60) + ':' + String(Math.round(t % 60)).padStart(2, '0'); return f(s) + ' - ' + f(e); };
const fmtClock = ts => new Date(ts * 1000).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });
// 任务摘要：clips 显示原输入；publish/subtitle/dub 解析出人话摘要，不裸露 JSON
function jobSummary(j) {
  if (j.kind === 'clips') return j.input;
  try {
    const r = JSON.parse(j.input);
    if (j.kind === 'publish') return `发布 ${r.clip || ''} → ${(r.platforms || []).join('/')}${r.dry_run ? '（演练）' : ''}`;
    if (j.kind === 'subtitle') return `字幕 ${r.clip || ''}（${r.style === 'zh' ? '纯中文' : '双语'}）`;
    if (j.kind === 'dub') return `配音 ${r.clip || ''}`;
  } catch (e) {}
  return j.input;
}
async function fetchJSON(url, opt) { const r = await fetch(url, opt); if (!r.ok) throw new Error(r.status + ' ' + await r.text()); return r.json(); }

/* ═══════════ 页面：弹幕曲线（M4.2，对齐原版 Barrage Curve/BarrageScoreCurve）═══════════ */
let barrageRoom = '';
let barrageData = { buckets: [] };
async function refreshBarrage() {
  if (page !== 'barrage' || !barrageRoom) return;
  try {
    barrageData = await fetchJSON('/api/live/barrage?room_id=' + encodeURIComponent(barrageRoom) + '&minutes=' + (barrageMinutes || 120));
  } catch (e) { return; }
  const el = $('#page');
  if (el) { drawBarrage($('#barrage-canvas'), barrageData.buckets); $('#barrage-stat').textContent = statText(); }
}
let barrageMinutes = 120;
function statText() {
  if (!barrageData.buckets || !barrageData.buckets.length) return '暂无弹幕数据（直播中才有）';
  const sum = barrageData.buckets.reduce((a, b) => a + b.count, 0);
  const n = barrageData.buckets.length;
  const max = Math.max(...barrageData.buckets.map(b => b.count));
  const t0 = barrageData.buckets[0].ts, t1 = barrageData.buckets[n - 1].ts;
  return `共 ${sum} 条弹幕 · 峰值 ${max} 条/5s · 覆盖 ${fmtDur(t1 - t0)}`;
}
function renderBarrage(el) {
  const w = watches.find(x => x.room_id === barrageRoom);
  el.innerHTML = `
    <div class="feed">
      <select id="barrage-room" style="flex:1;max-width:360px;padding:9px 12px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px">
        ${watches.map(x => `<option value="${x.room_id}" ${x.room_id === barrageRoom ? 'selected' : ''}>房间 ${x.room_id} · ${esc(x.title || '')}</option>`).join('')}
      </select>
      <select id="barrage-min" style="padding:9px 12px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px">
        <option value="30">近 30 分</option><option value="120" ${barrageMinutes === 120 ? 'selected' : ''}>近 2 小时</option><option value="360" ${barrageMinutes === 360 ? 'selected' : ''}>近 6 小时</option>
      </select>
      <button onclick="refreshBarrage()">刷新</button>
    </div>
    <div class="ph-card">
      <div class="ph-name">弹幕密度曲线<span class="ph-tag">M4.2</span></div>
      <div class="ph-origin">血统：原版 chopperbot-barrage · BarrageScoreCurve</div>
      <div class="ph-desc" id="barrage-stat" style="margin-bottom:12px"></div>
      <canvas id="barrage-canvas" style="width:100%;height:260px;background:var(--card);border:1px solid var(--line);border-radius:10px"></canvas>
      <div class="hint" style="margin-top:10px">弹幕 WebSocket 采集（5s/桶）→ 密度曲线实时展示；录制会话结束自动落库。后续与 ASR 转写 + LLM 评分融合为双信号高光检测。</div>
    </div>`;
  const sel = $('#barrage-room');
  if (sel) {
    sel.addEventListener('change', () => { barrageRoom = sel.value; refreshBarrage(); });
    if (!barrageRoom && sel.value) { barrageRoom = sel.value; }
  }
  const mins = $('#barrage-min');
  if (mins) mins.addEventListener('change', () => { barrageMinutes = +mins.value; refreshBarrage(); });
  if (barrageRoom) refreshBarrage();
  else { const st = $('#barrage-stat'); if (st) st.textContent = '请选择直播间（录制中自动采集弹幕）'; }
}
function drawBarrage(canvas, buckets) {
  if (!canvas || !buckets || !buckets.length) { return; }
  const ctx = canvas.getContext('2d');
  const W = canvas.clientWidth || 800, H = canvas.clientHeight || 240;
  canvas.width = W * 2; canvas.height = H * 2; // 高清屏 2x
  ctx.scale(2, 2);
  ctx.fillStyle = '#101820'; ctx.fillRect(0, 0, W, H);
  const max = Math.max(5, ...buckets.map(b => b.count));
  const t0 = buckets[0].ts, t1 = buckets[buckets.length - 1].ts;
  const span = Math.max(1, t1 - t0);
  const pad = 30;
  // 网格
  ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1;
  for (let g = 0; g < 4; g++) {
    const y = pad + (H - pad * 2) * g / 3;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  // 折线
  ctx.strokeStyle = '#e8b34b'; ctx.lineWidth = 2;
  ctx.beginPath();
  buckets.forEach((b, i) => {
    const x = (b.ts - t0) / span * (W - pad) + pad;
    const y = H - pad - (b.count / max) * (H - pad * 2);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();
  // 峰值标注
  let peak = 0;
  buckets.forEach((b, i) => { if (b.count > peak) peak = b.count; });
  const pk = buckets.find(b => b.count === peak);
  if (pk) {
    const x = (pk.ts - t0) / span * (W - pad) + pad;
    ctx.fillStyle = '#e8e0d0'; ctx.font = '11px system-ui';
    ctx.fillText('峰值 ' + peak, Math.max(4, x - 24), pad - 2);
  }
  // 时间轴标签
  ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = '11px system-ui';
  const ticks = 4;
  for (let i = 0; i <= ticks; i++) {
    const t = t0 + span * i / ticks;
    const x = (t - t0) / span * (W - pad) + pad;
    ctx.fillText(fmtClock(t), x - 24, H - 6);
  }
  ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '11px system-ui';
  ctx.fillText('弹幕/5s', 4, 12);
}

/* ═══════════ 任务列表渲染（总览/任务中心共用）═══════════ */
function trackHTML(job) {
  const stages = KIND_STAGES[job.kind] || KIND_STAGES.clips;
  const cur = stages.indexOf(job.stage);
  let nodeState = () => '', segState = () => '';
  if (job.status === 'running' && cur >= 0) {
    nodeState = i => i < cur ? 'done' : i === cur ? 'active' : '';
    segState = i => i < cur ? 'done' : i === cur ? 'active' : '';
  } else if (job.status === 'review' || job.status === 'done') {
    nodeState = segState = () => 'done';
  } else if (job.status === 'failed') {
    nodeState = i => i < cur ? 'done' : i === cur ? 'fail' : '';
    segState = i => i < cur ? 'done' : '';
  }
  let h = '<div class="track" role="img" aria-label="阶段 ' + (job.stage || '') + '">';
  stages.forEach((s, i) => {
    if (i > 0) h += `<span class="seg ${segState(i - 1)}"></span>`;
    h += `<span class="node ${nodeState(i)}" title="${s}"></span>`;
  });
  return h + '</div>';
}
function renderJobList(container, list, expandable) {
  if (!list.length) {
    container.innerHTML = `<div class="empty"><span class="arrow">↓ 投喂链接</span>
      <div class="big">${page === 'board' ? '流水线还没有开工' : '没有这类任务'}</div>
      <div class="small">${page === 'board' ? '粘贴一个视频链接，回车即开：下载 → 转写 → 选高光 → 切片 → 审核 → 发布' : '切个筛选看看其他类型'}</div></div>`;
    return;
  }
  container.innerHTML = list.map(j => `
    <div class="job" id="job-${j.id}">
      <div class="job-row" onclick="toggle('${j.id}')">
        <span class="kind ${j.kind}">${j.kind}</span>
        <span class="jid">${j.id}</span>
        ${trackHTML(j)}
        <span class="badge ${j.status}">${STATUS_CN[j.status] || j.status}</span>
        <span class="jtime">${fmtClock(j.createdAt)}</span>
        <span class="jinput" title="${esc(j.input)}">${esc(jobSummary(j))}</span>
        <button class="del" title="删除" onclick="event.stopPropagation();delJob('${j.id}')">✕</button>
      </div>
      <div class="detail" id="detail-${j.id}"></div>
    </div>`).join('');
  if (openId) {
    const el = document.getElementById('detail-' + openId);
    const job = jobs.find(j => j.id === openId);
    if (el && job) { el.classList.add('open'); renderDetailBody(el, job); }
  }
}

/* ═══════════ 详情展开 / SSE ═══════════ */
async function toggle(id) {
  if (openId === id) { closeDetail(); return; }
  closeDetail();
  openId = id;
  const el = document.getElementById('detail-' + id);
  if (!el) return;
  el.classList.add('open');
  const job = jobs.find(j => j.id === id);
  if (job) renderDetailBody(el, job);
  connectSSE(id);
  try { const fresh = await fetchJSON('/api/jobs/' + id); renderDetailBody(el, fresh); } catch (e) {}
}
function closeDetail() {
  if (es) { es.close(); es = null; }
  if (openId && $('#detail-' + openId)) $('#detail-' + openId).classList.remove('open');
  openId = null;
}
function connectSSE(id) {
  if (es) es.close();
  es = new EventSource('/api/jobs/' + id + '/events');
  es.onmessage = ev => {
    try {
      const msg = JSON.parse(ev.data);
      if (msg.type === 'log' && msg.msg) appendLog(id, msg.msg);
      else if (msg.type === 'job' && msg.job) {
        const el = document.querySelector('#detail-' + id);
        if (el) renderDetailBody(el, msg.job);
      }
    } catch (e) {}
  };
  es.onerror = () => { /* 轮询兜底，EventSource 自动重连 */ };
}
function appendLog(id, line) {
  const pre = document.querySelector('#detail-' + id + ' pre.log');
  if (pre) { pre.textContent += line + '\n'; pre.scrollTop = pre.scrollHeight; }
}

/* ═══════════ 卡片渲染（详情 & 审核台共用）═══════════ */
function clipHTML(job, c, idx) {
  const file = '/api/files/' + job.id + '/' + c.file;
  const cover = c.cover ? '/api/files/' + job.id + '/' + c.cover : null;
  const dur = Math.round(c.end - c.start);
  const acts = job.status === 'review' ? `
    <div class="acts">
      <button class="b-pub" onclick="openPubModal('${job.id}', ${idx})">发布</button>
      <button class="b-sub" onclick="openSubModal('${job.id}', ${idx})">加字幕</button>
      <button class="b-dub" onclick='openDubModal(${JSON.stringify({ jobId: job.id, clip: { file: c.file, cover: c.cover || '', title: c.title } })})">配音</button>
    </div>` : '';
  return `<div class="clip">
    <video controls preload="metadata" src="${file}" ${cover ? `poster="${cover}"` : ''}></video>
    <div class="meta">
      <div class="title">${esc(c.title || '未命名')}</div>
      <div class="info"><span>${fmtRange(c.start, c.end)} · ${dur}s${c.score ? ' · 评分' + Math.round(c.score) : ''}</span>
      <a href="${file}" download>下载</a></div>
      ${acts}
    </div>
  </div>`;
}
function clipsGrid(job, r) {
  detailClips = r.clips || [];
  return '<div class="clips">' + r.clips.map((c, i) => clipHTML(job, c, i)).join('') + '</div>';
}
function subtitleCard(job, r) {
  const src = r.source_job, f = '/api/files/' + src + '/' + r.subtitled;
  const cover = r.cover ? '/api/files/' + src + '/' + r.cover : null;
  const c = { file: r.subtitled, cover: r.cover || '', title: r.title };
  return `<div class="clip oneclip">
    <video controls preload="metadata" src="${f}" ${cover ? `poster="${cover}"` : ''}></video>
    <div class="meta">
      <div class="title">${esc(r.title || '')}</div>
      <div class="info"><span>字幕成品 · ${r.segments} 条 · ${r.style === 'bilingual' ? '双语' : '纯中文'}</span><a href="${f}" download>下载</a></div>
      <div class="acts">
        <button class="b-pub" onclick='openPubModalFor(${JSON.stringify({ jobId: src, clip: c })})'>发布</button>
        <button class="b-dub" onclick='openDubModal(${JSON.stringify({ jobId: src, clip: c })})'>配音解说</button>
      </div>
    </div></div>`;
}
function dubCard(job, r) {
  const src = r.source_job, f = '/api/files/' + src + '/' + r.dubbed;
  const cover = r.cover ? '/api/files/' + src + '/' + r.cover : null;
  const c = { file: r.dubbed, cover: r.cover || '', title: r.title };
  return `<div class="clip oneclip">
    <video controls preload="metadata" src="${f}" ${cover ? `poster="${cover}"` : ''}></video>
    <div class="meta">
      <div class="title">${esc(r.title || '')}</div>
      <div class="info"><span>配音成品 · ${esc(r.voice)} · 解说稿 ${r.script_len} 字</span><a href="${f}" download>下载</a></div>
      <div class="acts"><button class="b-pub" onclick='openPubModalFor(${JSON.stringify({ jobId: src, clip: c })})'>发布</button></div>
    </div></div>`;
}
function renderDetailBody(el, job) {
  if (!el || !job) return;
  let extra = '';
  try {
    const r = JSON.parse(job.result || '{}');
    if (job.kind === 'publish' && r.results) {
      extra = '<h4>发布结果' + (r.dry_run ? '（演练）' : '') + '</h4>' + r.results.map(pr => `
        <div class="pub-result ${pr.ok ? 'ok' : 'fail'}">${pr.ok ? '✔' : '✗'} <b>${esc(pr.platform)}</b>：${esc(pr.detail || '')}
        ${pr.screenshot ? `<img src="/api/files/${job.id}/${pr.screenshot}">` : ''}</div>`).join('');
    } else if (job.kind === 'subtitle' && r.subtitled) {
      extra = '<h4>字幕成品</h4>' + subtitleCard(job, r);
    } else if (job.kind === 'dub' && r.dubbed) {
      extra = '<h4>配音成品</h4>' + dubCard(job, r);
    } else if (r.clips && r.clips.length) {
      extra = '<h4>切片成品（' + r.clips.length + '）</h4>' + clipsGrid(job, r);
    }
  } catch (e) {}
  el.innerHTML = `
    ${job.error ? '<div class="err-line">✗ ' + esc(job.error) + '</div>' : ''}
    <h4>运行日志</h4>
    <pre class="log">${esc(job.log || '（等待输出…）')}</pre>
    ${extra}`;
  const pre = el.querySelector('pre.log');
  if (pre) pre.scrollTop = pre.scrollHeight;
}

/* ═══════════ 删除 ═══════════ */
async function delJob(id) {
  if (!confirm('删除任务 ' + id + '？（文件保留在 data/jobs/）')) return;
  try { await fetchJSON('/api/jobs/' + id, { method: 'DELETE' }); if (openId === id) closeDetail(); refresh(); } catch (e) { alert(e.message); }
}

/* ═══════════ 弹窗（发布/字幕/配音）═══════════ */
function openPubModal(jobId, idx) { const c = detailClips[idx]; if (c) openPubModalFor({ jobId, clip: c }); }
function openPubModalFor(ctx) {
  pubCtx = ctx;
  const c = ctx.clip;
  $('#pub-meta').textContent = c.file + (c.cover ? ' ｜ 封面 ' + c.cover : ' ｜ 无封面');
  $('#pub-title').value = c.title || '';
  $('#pub-desc').value = '';
  $('#pub-tags').value = '';
  $('#pub-dryrun').checked = false;
  $('#pub-bg').style.display = 'flex';
}
function closePubModal() { $('#pub-bg').style.display = 'none'; pubCtx = null; }
async function submitPublish() {
  if (!pubCtx) return;
  const platforms = [];
  if ($('#pub-bilibili').checked) platforms.push('bilibili');
  if ($('#pub-douyin').checked) platforms.push('douyin');
  if (!platforms.length) { alert('至少选择一个发布平台'); return; }
  const req = {
    source_job: pubCtx.jobId, clip: pubCtx.clip.file, cover: pubCtx.clip.cover || '',
    title: $('#pub-title').value.trim() || (pubCtx.clip.title || ''),
    desc: $('#pub-desc').value.trim(),
    tags: $('#pub-tags').value.split(/[,，、\s]+/).filter(Boolean),
    platforms, dry_run: $('#pub-dryrun').checked
  };
  try {
    await fetchJSON('/api/jobs', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kind: 'publish', input: JSON.stringify(req) }) });
    closePubModal(); refresh();
  } catch (e) { alert('创建发布任务失败：' + e.message); }
}
function openSubModal(jobId, idx) {
  const c = detailClips[idx]; if (!c) return;
  subCtx = { jobId, clip: c };
  $('#sub-meta').textContent = c.file + ' ｜ ' + (c.title || '');
  $('#sub-style-bi').checked = true;
  $('#sub-bg').style.display = 'flex';
}
function closeSubModal() { $('#sub-bg').style.display = 'none'; subCtx = null; }
async function submitSubtitle() {
  if (!subCtx) return;
  const req = { source_job: subCtx.jobId, clip: subCtx.clip.file, style: $('#sub-style-bi').checked ? 'bilingual' : 'zh' };
  try {
    await fetchJSON('/api/jobs', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kind: 'subtitle', input: JSON.stringify(req) }) });
    closeSubModal(); refresh();
  } catch (e) { alert('创建字幕任务失败：' + e.message); }
}
function openDubModal(ctx) {
  dubCtx = ctx;
  $('#dub-meta').textContent = ctx.clip.file + ' ｜ ' + (ctx.clip.title || '');
  $('#dub-bg').style.display = 'flex';
}
function closeDubModal() { $('#dub-bg').style.display = 'none'; dubCtx = null; }
async function submitDub() {
  if (!dubCtx) return;
  const req = { source_job: dubCtx.jobId, clip: dubCtx.clip.file, voice: $('#dub-voice').value, keep_audio: $('#dub-keep').checked };
  try {
    await fetchJSON('/api/jobs', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kind: 'dub', input: JSON.stringify(req) }) });
    closeDubModal(); refresh();
  } catch (e) { alert('创建配音任务失败：' + e.message); }
}

/* ═══════════ 刷新循环 ═══════════ */
async function refresh() {
  try { jobs = await fetchJSON('/api/jobs'); } catch (e) { return; }
  renderNav();
  if (page === 'board') { renderBoard($('#page')); }
  else if (page === 'tasks') { const c = $('#task-jobs'); if (c) renderJobList(c, jobs.filter(j => taskFilter === 'all' || j.kind === taskFilter), true); }
  else if (page === 'review') { renderReview($('#page')); }
	else if (page === 'livefollow') { refreshWatches(); }
  else if (page === 'barrage') { refreshBarrage(); }
}
async function fetchStats() {
  try { stats = await fetchJSON('/api/stats'); renderNav(); if (page === 'settings') renderSettings($('#page')); } catch (e) {}
}

/* ═══════════ 启动 ═══════════ */
window.addEventListener('hashchange', route);
fetchStats();
route();
refreshWatches();
setInterval(() => { if (!document.hidden) refresh(); }, 2500);
setInterval(() => { if (!document.hidden) refreshWatches(); }, 8000);
setInterval(() => { if (!document.hidden) fetchStats(); }, 30000);
</script>
